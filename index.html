<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neyen | el arte de respirar</title>
     <link rel="stylesheet" href="style.css">

    <!-- ── Primary meta ──────────────────────────────── -->
    <meta name="description" content="Guided breathing techniques to calm, focus, or energize you.">
    <meta name="theme-color" content="#06030f">
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <!-- ── Open Graph (WhatsApp, Telegram, LinkedIn…) ── -->
    <meta property="og:type"        content="website">
    <meta property="og:title"       content="Neyen | the art of breathing">
    <meta property="og:description" content="Guided breathing techniques to calm, focus, or energize you.">
    <meta property="og:image"       content="https://neyenbreath.netlify.app/assets/icons/og-image.png">
    <meta property="og:url"         content="https://neyenbreath.netlify.app">

    <!-- ── Twitter / X ──────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="Neyen | the art of breathing">
    <meta name="twitter:description" content="Guided breathing techniques to calm, focus, or energize you.">
    <meta name="twitter:image"       content="https://neyenbreath.netlify.app/assets/icons/og-image.png">
</head>
</head>
<body>
    <div class="main-layout">
        <div class="container">

            <!-- Header -->
            <div class="header-row">
                <h1 data-i18n="title">Neyen | el arte de respirar</h1>
            </div>

            <!-- Stats row -->
            <div class="stats-box">
                <div class="stat-item">
                    <span class="stat-label" data-i18n="statSession">Sesión</span>
                    <span class="stat-value" id="session-counter">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label" data-i18n="statCycles">Ciclos</span>
                    <span class="stat-value" id="cycle-counter">0</span>
                </div>
                <div class="stat-item stat-item--last">
                    <span class="stat-label" data-i18n="statLast">Última</span>
                    <span class="stat-value" id="last-session">--</span>
                </div>
            </div>

            <!-- Technique name + limit badge row -->
            <div class="meta-row" id="meta-row">
                <span id="technique-label">Respiración cuadrada</span>
                <span id="limit-badge" class="limit-badge" style="display:none"></span>
            </div>

            <!-- Breathing circle (tap to start/stop) -->
            <div id="breathing-circle-container">
                <div id="breathing-circle">
                    <span id="breath-text" data-i18n="ready">Listo</span>
                    <div id="phase-timer"></div>
                </div>
            </div>

            <!-- Two action pills — hidden during session -->
            <div class="action-pills" id="action-pills">
                <button class="pill-tecnicas" id="tecnicas-btn" data-i18n="menuPresets">Técnicas</button>
                <button class="pill-ambient" id="ambient-btn" aria-label="Música ambiente">🎵</button>
            </div>

            <!-- Footer -->
            <footer>
                <a href="https://buymeacoffee.com/soypradito" target="_blank" class="bmc-btn">
                    <span data-i18n="donate">😊 Dona</span>
                </a>
                <span class="footer-sep">·</span>
                <a href="https://instagram.com/soypradito" target="_blank" class="author-tag">@soypradito</a>
            </footer>
        </div>
    </div>

    <!-- Modal: Técnicas -->
    <div class="modal-overlay" id="modal-tecnicas">
        <div class="modal modal-tecnicas-modal">
            <div class="modal-header">
                <span class="modal-title" data-i18n="menuPresets">Técnicas</span>
                <button class="modal-close" data-close="modal-tecnicas">✕</button>
            </div>
            <div class="modal-body">
                <div id="presets-list"></div>
            </div>
        </div>
    </div>

    <!-- Hidden elements for JS compatibility -->
    <div style="display:none">
        <button id="lang-btn">ES</button>
        <div id="lang-dropdown">
            <button class="ctrl-option active" data-value="es">ES — Español</button>
            <button class="ctrl-option" data-value="en">EN — English</button>
        </div>
    </div>

    <script type="module" src="/assets/js/main.js"></script>
    <script defer src="tutorial.js"></script>
    <script>

    </script>
</body>
</html>
