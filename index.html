<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathwork Timer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-layout">
        <div class="volume-container">
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" orient="vertical">
            <span>Vol</span>
        </div>

        <div class="container">
            <h1>Breathwork Timer</h1>

            <div class="stats-row">
              <div id="session-counter">00:00</div>
              <div id="cycle-counter">Ciclos: 0</div>
            </div>
    
            <div id="last-session">Última: --:-- (0 ciclos)</div>
            
            <div id="breathing-circle-container">
                <div id="breathing-circle">
                    <span id="breath-text">Listo</span>
                    <div id="phase-timer">--</div>
                </div>
            </div>

            <div class="settings-grid">
                <div class="input-group">
                    <label>Inhala</label>
                    <input type="number" id="time-inhale" value="4" min="1">
                </div>
                <div class="input-group">
                    <label>Pausa (L)</label>
                    <input type="number" id="time-hold-full" value="4" min="0">
                </div>
                <div class="input-group">
                    <label>Exhala</label>
                    <input type="number" id="time-exhale" value="4" min="1">
                </div>
                <div class="input-group">
                    <label>Pausa (V)</label>
                    <input type="number" id="time-hold-empty" value="4" min="0">
                </div>
            </div>

            <button id="start-btn">Iniciar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
