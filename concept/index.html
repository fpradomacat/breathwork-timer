<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf6f0" />
    <meta name="robots" content="noindex" />
    <title>Neyen · Concepto «Lente»</title>
    <style>
      /* ─────────────────────────────────────────────────────────────
         Neyen · concept "Lente"
         A design proposal, not the app. One file, no dependencies.
         Layers, back to front:
           1. #aurora  WebGL: a living version of the landing's hero aura.
              The breathing circle is a lens inside it: at rest invisible,
              on the inhale it magnifies, saturates and splits the light
              at its rim (a prism) — the background itself condenses.
           2. #motes   Canvas: dust in the light, drawn in on the inhale,
              released on the exhale.
           3. The DOM: ring, progress comet, type, glass UI.
         ───────────────────────────────────────────────────────────── */
      :root {
        --cream: #faf6f0;
        --ink: #22303a;
        --ink-soft: #46555c;
        --accent: #3e7189;
        --sky: #a9d0e2;
        --peach: #f1d9c4;
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino,
          'Book Antiqua', Georgia, serif;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-breath: cubic-bezier(0.37, 0, 0.63, 1);
        --glass: rgba(255, 253, 249, 0.42);
        --glass-border: rgba(255, 255, 255, 0.65);
        --orb: min(72vw, 330px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--cream);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      /* ── Background layers ───────────────────────────────────────── */
      #aurora,
      #motes {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #motes {
        pointer-events: none;
      }
      /* No WebGL: a static version of the landing aura */
      .no-gl #aurora {
        background: radial-gradient(
            ellipse 60% 50% at 15% 10%,
            var(--sky),
            transparent 70%
          ),
          radial-gradient(
            ellipse 55% 45% at 90% 95%,
            var(--peach),
            transparent 70%
          ),
          var(--cream);
      }

      /* ── Layout ──────────────────────────────────────────────────── */
      .app {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: max(18px, env(safe-area-inset-top)) 20px
          max(18px, env(safe-area-inset-bottom));
      }

      /* Chrome that steps aside during a session */
      .chrome {
        transition:
          opacity 1.1s var(--ease-out),
          filter 1.1s var(--ease-out),
          transform 1.1s var(--ease-out);
      }
      .in-session .chrome {
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
      }
      .in-session header.chrome {
        transform: translateY(-14px);
      }
      .in-session .dock.chrome {
        transform: translateY(24px);
      }

      /* ── Header ──────────────────────────────────────────────────── */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .wordmark {
        display: flex;
        align-items: baseline;
        gap: 12px;
        text-decoration: none;
        color: var(--ink);
      }
      .wordmark b {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 1.55rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }
      .wordmark small {
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .wordmark .l {
        display: inline-block;
        animation: letter-in 1.4s var(--ease-out) both;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: 0 8px 24px -14px rgba(34, 48, 58, 0.35);
        font-size: 0.86rem;
        color: var(--ink);
        text-decoration: none;
        transition:
          background 0.4s,
          transform 0.4s var(--ease-out);
      }
      .pill:hover {
        background: rgba(255, 253, 249, 0.7);
        transform: translateY(-1px);
      }
      /* Equalizer: still when muted, breathing when on */
      .eq {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
      }
      .eq i {
        width: 2px;
        height: 4px;
        border-radius: 1px;
        background: var(--accent);
        transition: height 0.3s;
      }
      .sound-on .eq i {
        animation: eq 1.1s ease-in-out infinite;
      }
      .sound-on .eq i:nth-child(2) {
        animation-delay: -0.4s;
      }
      .sound-on .eq i:nth-child(3) {
        animation-delay: -0.8s;
      }
      @keyframes eq {
        0%,
        100% {
          height: 3px;
        }
        50% {
          height: 12px;
        }
      }

      /* ── Stage: the circle ───────────────────────────────────────── */
      .stage {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 22px;
        min-height: 0;
      }
      .eyebrow {
        margin: 0;
        font-size: 0.74rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ink-soft);
        text-align: center;
        transition: opacity 0.6s;
      }
      .eyebrow em {
        font-style: normal;
        color: var(--accent);
      }
      .orb {
        position: relative;
        width: var(--orb);
        height: var(--orb);
        border: 0;
        padding: 0;
        background: none;
        border-radius: 50%;
        -webkit-tap-highlight-color: transparent;
      }
      .orb:focus-visible {
        outline: 1px solid rgba(62, 113, 137, 0.45);
        outline-offset: 14px;
      }
      .ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        transform: scale(var(--s, 0.86));
        will-change: transform;
      }
      .ring circle {
        vector-effect: non-scaling-stroke;
        fill: none;
      }
      .ring .base {
        stroke: rgba(62, 113, 137, 0.42);
        stroke-width: 1;
        stroke-dasharray: 1 1;
        animation: draw 2.4s var(--ease-out) 0.35s both;
      }
      .ring .trail {
        stroke: #fff;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-dasharray: 0 1;
        opacity: 0;
        transition: opacity 0.8s;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.9));
      }
      .ring .tick {
        fill: rgba(62, 113, 137, 0.55);
        opacity: 0;
        transition: opacity 0.8s;
      }
      .ring .comet {
        fill: #fff;
        opacity: 0;
        transition: opacity 0.8s;
        filter: drop-shadow(0 0 6px #fff)
          drop-shadow(0 0 14px rgba(169, 208, 226, 0.9));
      }
      .in-session .ring .trail,
      .in-session .ring .comet,
      .in-session .ring .tick {
        opacity: 1;
      }
      @keyframes draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Type inside the circle (not scaled with it) */
      .orb-text {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 4px;
        pointer-events: none;
        text-align: center;
      }
      .phase {
        min-height: 1.3em;
        font-family: var(--serif);
        font-size: clamp(1.5rem, 6vw, 2rem);
        letter-spacing: 0.08em;
        color: var(--ink);
      }
      .phase.hint {
        font-style: italic;
        font-size: 1.15rem;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
      }
      .phase .l {
        display: inline-block;
        white-space: pre;
        animation: letter-in 0.9s var(--ease-out) both;
      }
      .phase.out .l {
        animation: letter-out 0.28s ease-in both;
      }
      .count {
        min-height: 1.2em;
        font-family: var(--sans);
        font-weight: 200;
        font-size: clamp(2.6rem, 11vw, 3.6rem);
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .count span {
        display: inline-block;
        animation: num-in 0.7s var(--ease-out) both;
      }
      @keyframes letter-in {
        from {
          opacity: 0;
          filter: blur(8px);
          transform: translateY(0.35em);
        }
      }
      @keyframes letter-out {
        to {
          opacity: 0;
          filter: blur(6px);
          transform: translateY(-0.25em);
        }
      }
      @keyframes num-in {
        from {
          opacity: 0;
          filter: blur(10px);
          transform: scale(0.82);
        }
      }

      .meta {
        display: flex;
        gap: 18px;
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .meta b {
        font-weight: 500;
        color: var(--ink);
      }

      /* ── Dock: techniques + duration ─────────────────────────────── */
      .dock {
        display: grid;
        gap: 14px;
        justify-items: center;
      }
      .cards {
        display: flex;
        gap: 12px;
        width: min(100%, 860px);
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 6px 4px 10px;
        scrollbar-width: none;
      }
      .cards::-webkit-scrollbar {
        display: none;
      }
      .card {
        --rx: 0deg;
        --ry: 0deg;
        --mx: 50%;
        --my: 0%;
        position: relative;
        flex: 1 0 180px;
        scroll-snap-align: center;
        display: grid;
        gap: 6px;
        padding: 14px 16px 12px;
        text-align: left;
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: 0 14px 34px -22px rgba(34, 48, 58, 0.45);
        transform: perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));
        transition:
          transform 0.6s var(--ease-out),
          box-shadow 0.6s,
          border-color 0.6s;
        overflow: hidden;
        animation: rise 1.2s var(--ease-out) backwards;
      }
      .card::after {
        /* sheen that follows the pointer */
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          240px circle at var(--mx) var(--my),
          rgba(255, 255, 255, 0.55),
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      .card:hover::after {
        opacity: 1;
      }
      .card.tilting {
        transition:
          box-shadow 0.6s,
          border-color 0.6s;
      }
      .card[aria-pressed='true'] {
        border-color: rgba(62, 113, 137, 0.55);
        box-shadow:
          0 0 0 1px rgba(62, 113, 137, 0.25),
          0 18px 40px -20px rgba(62, 113, 137, 0.55);
      }
      .card .goal {
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .card .name {
        font-family: var(--serif);
        font-size: 1.12rem;
        color: var(--ink);
      }
      .card .timing {
        font-size: 0.74rem;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .card svg {
        width: 100%;
        height: 38px;
        overflow: visible;
      }
      .card svg path {
        fill: none;
        stroke: rgba(62, 113, 137, 0.35);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .card svg circle {
        fill: var(--accent);
        opacity: 0.35;
      }
      .card[aria-pressed='true'] svg path {
        stroke: rgba(62, 113, 137, 0.75);
      }
      .card[aria-pressed='true'] svg circle {
        opacity: 1;
        filter: drop-shadow(0 0 4px rgba(62, 113, 137, 0.6));
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(26px);
          filter: blur(6px);
        }
      }

      .segmented {
        position: relative;
        display: inline-flex;
        padding: 4px;
        border-radius: 999px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        animation: rise 1.2s var(--ease-out) 0.55s backwards;
      }
      .segmented .thumb {
        position: absolute;
        top: 4px;
        bottom: 4px;
        left: 0;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 4px 14px -6px rgba(34, 48, 58, 0.35);
        transition:
          transform 0.6s var(--ease-out),
          width 0.6s var(--ease-out);
      }
      .segmented button {
        position: relative;
        z-index: 1;
        min-width: 54px;
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: none;
        font-size: 0.84rem;
        color: var(--ink-soft);
        transition: color 0.4s;
      }
      .segmented button[aria-pressed='true'] {
        color: var(--ink);
        font-weight: 500;
      }

      /* ── Session-only meta ───────────────────────────────────────── */
      .session-meta {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(28px, env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 1s var(--ease-out) 0.4s,
          transform 1s var(--ease-out) 0.4s;
        pointer-events: none;
      }
      .in-session .session-meta {
        opacity: 1;
        transform: none;
      }
      .session-meta small {
        display: block;
        margin-top: 6px;
        text-align: center;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: none;
        color: var(--ink-soft);
      }

      /* ── Summary ─────────────────────────────────────────────────── */
      .summary {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(250, 246, 240, 0.25);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.8s var(--ease-out),
          visibility 0s 0.8s;
      }
      .summary.open {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s var(--ease-out);
      }
      .summary .sheet {
        width: min(100%, 380px);
        padding: 34px 30px 26px;
        border-radius: 28px;
        border: 1px solid var(--glass-border);
        background: rgba(255, 253, 249, 0.62);
        -webkit-backdrop-filter: blur(24px) saturate(1.5);
        backdrop-filter: blur(24px) saturate(1.5);
        box-shadow: 0 30px 70px -30px rgba(34, 48, 58, 0.5);
        text-align: center;
        transform: translateY(30px) scale(0.96);
        filter: blur(8px);
        transition:
          transform 1s var(--ease-out),
          filter 1s var(--ease-out);
      }
      .summary.open .sheet {
        transform: none;
        filter: none;
      }
      .summary h2 {
        margin: 0 0 8px;
        font-family: var(--serif);
        font-weight: 400;
        font-size: 2.1rem;
      }
      .summary p {
        margin: 0 0 24px;
        color: var(--ink-soft);
        letter-spacing: 0.06em;
      }
      .summary .row {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .btn {
        height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        font-size: 0.92rem;
        transition:
          transform 0.4s var(--ease-out),
          background 0.3s;
      }
      .btn:hover {
        transform: translateY(-1px);
        background: #2e5a6f;
      }
      .btn.ghost {
        background: transparent;
        color: var(--accent);
      }
      .btn.ghost:hover {
        background: rgba(62, 113, 137, 0.08);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (max-height: 700px) {
        :root {
          --orb: min(62vw, 260px);
        }
        .card svg {
          height: 26px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
        }
        #motes {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="aurora" aria-hidden="true"></canvas>
    <canvas id="motes" aria-hidden="true"></canvas>

    <div class="app">
      <header class="chrome">
        <a
          class="wordmark"
          href="../light.html"
          aria-label="Neyen, volver a la app"
        >
          <b id="wordmark">Neyen</b>
          <small>el arte de respirar</small>
        </a>
        <div class="actions">
          <button class="pill" id="sound" aria-pressed="false">
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
            Sonido
          </button>
        </div>
      </header>

      <main class="stage">
        <p class="eyebrow chrome" id="eyebrow"></p>
        <button class="orb" id="orb" aria-describedby="phase">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="base" cx="100" cy="100" r="99" pathLength="1" />
            <g id="ticks"></g>
            <circle
              class="trail"
              id="trail"
              cx="100"
              cy="100"
              r="99"
              pathLength="1"
              transform="rotate(-90 100 100)"
            />
            <circle class="comet" id="comet" cx="100" cy="1" r="2.6" />
          </svg>
          <span class="orb-text">
            <span class="phase hint" id="phase" aria-live="polite"></span>
            <span class="count" id="count" aria-hidden="true"></span>
          </span>
        </button>
        <div class="meta chrome" id="meta"></div>
      </main>

      <section class="dock chrome" aria-label="Técnica y duración">
        <div class="cards" id="cards" role="group" aria-label="Técnicas"></div>
        <div
          class="segmented"
          id="durations"
          role="group"
          aria-label="Duración"
        >
          <span class="thumb" id="thumb"></span>
        </div>
      </section>
    </div>

    <div class="session-meta" aria-hidden="true">
      <div class="meta">
        <span><b id="s-time">00:00</b></span
        ><span>ciclo <b id="s-cycle">1</b></span>
      </div>
    </div>
    <p class="sr-only">
      Tocá el círculo o pulsá la barra espaciadora para empezar o terminar.
    </p>

    <div
      class="summary"
      id="summary"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sum-title"
    >
      <div class="sheet">
        <h2 id="sum-title">Bien hecho.</h2>
        <p id="sum-text"></p>
        <div class="row">
          <button class="btn" id="again">Otra vez</button>
          <button class="btn ghost" id="close">Cerrar</button>
        </div>
      </div>
    </div>

    <script>
      (() => {
        'use strict';
        const $ = (s) => document.querySelector(s);
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ── Techniques (same rhythms as the app) ─────────────────── */
        const TECHNIQUES = [
          {
            id: 'coherence',
            goal: 'Calma',
            name: 'Coherencia cardíaca',
            t: [5, 0, 5, 0],
          },
          {
            id: 'box',
            goal: 'Foco',
            name: 'Respiración cuadrada',
            t: [4, 4, 4, 4],
          },
          {
            id: '478',
            goal: 'Sueño',
            name: '4-7-8 relajante',
            t: [4, 7, 8, 0],
          },
          {
            id: 'fire',
            goal: 'Energía',
            name: 'Respiración de fuego',
            t: [1, 0, 1, 0],
          },
        ];
        const DURATIONS = [
          { label: '∞', min: 0 },
          { label: '3 min', min: 3 },
          { label: '5 min', min: 5 },
          { label: '10 min', min: 10 },
        ];
        const PHASES = [
          { label: 'Inhalá', from: 0, to: 1 },
          { label: 'Sostené', from: 1, to: 1 },
          { label: 'Exhalá', from: 1, to: 0 },
          { label: 'Pausa', from: 0, to: 0 },
        ];
        let tech = TECHNIQUES[0];
        let duration = DURATIONS[0];

        /* ── Type helpers: words that arrive letter by letter ──────── */
        function splitInto(el, text, step = 38, delay = 0) {
          el.textContent = '';
          [...text].forEach((ch, i) => {
            const s = document.createElement('span');
            s.className = 'l';
            s.textContent = ch;
            s.style.animationDelay = `${delay + i * step}ms`;
            el.appendChild(s);
          });
        }
        const phaseEl = $('#phase');
        const countEl = $('#count');
        let phaseText = '';
        let phaseSwap = 0;
        function setPhase(text, hint = false) {
          if (text === phaseText) return;
          phaseText = text;
          clearTimeout(phaseSwap);
          const apply = () => {
            phaseEl.classList.remove('out');
            phaseEl.classList.toggle('hint', hint);
            splitInto(phaseEl, text, hint ? 18 : 42);
          };
          if (phaseEl.textContent) {
            phaseEl.classList.add('out');
            phaseSwap = setTimeout(apply, 240);
          } else apply();
        }
        let countText = '';
        function setCount(n) {
          const t = n == null ? '' : String(n);
          if (t === countText) return;
          countText = t;
          countEl.innerHTML = t ? `<span>${t}</span>` : '';
        }

        /* ── Dock: technique cards with a live rhythm diagram ─────── */
        function rhythmPath([a, b, c, d]) {
          const total = a + b + c + d;
          const W = 120,
            top = 6,
            bot = 32;
          const x = (s) => (s / total) * W;
          let t = 0;
          let p = `M0 ${bot}`;
          const curve = (dur, y0, y1) => {
            const x0 = x(t),
              x1 = x(t + dur);
            const k = (x1 - x0) * 0.42;
            p += ` C${(x0 + k).toFixed(1)} ${y0} ${(x1 - k).toFixed(1)} ${y1} ${x1.toFixed(1)} ${y1}`;
            t += dur;
          };
          const flat = (dur, y) => {
            t += dur;
            p += ` L${x(t).toFixed(1)} ${y}`;
          };
          if (a) curve(a, bot, top);
          if (b) flat(b, top);
          if (c) curve(c, top, bot);
          if (d) flat(d, bot);
          return p;
        }
        const cardsEl = $('#cards');
        TECHNIQUES.forEach((tq, i) => {
          const b = document.createElement('button');
          b.className = 'card';
          b.style.animationDelay = `${0.25 + i * 0.09}s`;
          b.dataset.id = tq.id;
          b.setAttribute('aria-pressed', String(tq === tech));
          const total = tq.t.reduce((s, v) => s + v, 0);
          const pid = `rp-${tq.id}`;
          b.innerHTML = `
            <span class="goal">${tq.goal}</span>
            <span class="name">${tq.name}</span>
            <svg viewBox="0 0 120 38" aria-hidden="true">
              <path id="${pid}" d="${rhythmPath(tq.t)}"/>
              <circle r="3"><animateMotion dur="${Math.max(total, 2.4)}s" repeatCount="indefinite"><mpath href="#${pid}"/></animateMotion></circle>
            </svg>
            <span class="timing">${tq.t.join(' · ')}</span>`;
          b.addEventListener('click', () => chooseTechnique(tq));
          // tilt + sheen follow the pointer
          b.addEventListener('pointermove', (e) => {
            if (reduced) return;
            const r = b.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width,
              py = (e.clientY - r.top) / r.height;
            b.classList.add('tilting');
            b.style.setProperty('--ry', `${(px - 0.5) * 10}deg`);
            b.style.setProperty('--rx', `${(0.5 - py) * 10}deg`);
            b.style.setProperty('--mx', `${px * 100}%`);
            b.style.setProperty('--my', `${py * 100}%`);
          });
          b.addEventListener('pointerleave', () => {
            b.classList.remove('tilting');
            b.style.setProperty('--rx', '0deg');
            b.style.setProperty('--ry', '0deg');
          });
          cardsEl.appendChild(b);
        });

        const durEl = $('#durations');
        const thumb = $('#thumb');
        DURATIONS.forEach((d) => {
          const b = document.createElement('button');
          b.textContent = d.label;
          b.setAttribute('aria-pressed', String(d === duration));
          b.addEventListener('click', () => {
            duration = d;
            durEl
              .querySelectorAll('button')
              .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
            moveThumb();
          });
          durEl.appendChild(b);
        });
        function moveThumb() {
          const b = durEl.querySelector('[aria-pressed="true"]');
          thumb.style.width = `${b.offsetWidth}px`;
          thumb.style.transform = `translateX(${b.offsetLeft}px)`;
        }

        const eyebrow = $('#eyebrow');
        function chooseTechnique(tq) {
          tech = tq;
          cardsEl
            .querySelectorAll('.card')
            .forEach((c) =>
              c.setAttribute('aria-pressed', String(c.dataset.id === tq.id)),
            );
          eyebrow.innerHTML = `${tq.goal} · <em>${tq.name}</em>`;
          eyebrow.animate(
            [
              { opacity: 0, filter: 'blur(6px)' },
              { opacity: 1, filter: 'blur(0)' },
            ],
            {
              duration: 700,
              easing: 'cubic-bezier(.16,1,.3,1)',
            },
          );
          drawTicks();
          pulse();
        }

        /* Ring ticks at each phase boundary of the cycle */
        function drawTicks() {
          const g = $('#ticks');
          g.innerHTML = '';
          const total = tech.t.reduce((s, v) => s + v, 0);
          let acc = 0;
          tech.t.forEach((v) => {
            if (!v) return;
            const a = (acc / total) * Math.PI * 2 - Math.PI / 2;
            const c = document.createElementNS(
              'http://www.w3.org/2000/svg',
              'circle',
            );
            c.setAttribute('class', 'tick');
            c.setAttribute('r', '1.6');
            c.setAttribute('cx', (100 + 99 * Math.cos(a)).toFixed(2));
            c.setAttribute('cy', (100 + 99 * Math.sin(a)).toFixed(2));
            g.appendChild(c);
            acc += v;
          });
        }

        /* ── Breath engine ─────────────────────────────────────────── */
        const ease = (t) =>
          0.5 - 0.5 * Math.cos(Math.PI * Math.min(Math.max(t, 0), 1));
        const S = {
          running: false,
          startedAt: 0, // when the first inhale starts (after the countdown)
          breath: 0, // 0 empty … 1 full (target)
          shown: 0, // smoothed breath, what is drawn
          scale: 0.86,
          cycles: 0,
          elapsed: 0,
          velocity: 0,
        };
        const COUNTDOWN = 3;
        const orb = $('#orb');
        const ring = orb.querySelector('.ring');
        const ringBase = ring.querySelector('.base');
        const trail = $('#trail');
        const comet = $('#comet');

        function start() {
          if (S.running) return;
          closeSummary();
          S.running = true;
          S.cycles = 0;
          S.startedAt = performance.now() + COUNTDOWN * 1000;
          document.body.classList.add('in-session');
          orb.setAttribute('aria-label', 'Terminar la sesión');
          pulse();
          audio.ensure();
        }
        function stop(fromLimit = false) {
          if (!S.running) return;
          S.running = false;
          document.body.classList.remove('in-session');
          orb.setAttribute('aria-label', 'Empezar');
          setCount(null);
          setPhase('Tocá para empezar', true);
          pulse();
          const secs = Math.max(0, S.elapsed);
          if (fromLimit || secs >= 20) openSummary(secs);
        }
        orb.addEventListener('click', () => (S.running ? stop() : start()));
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if ($('#summary').classList.contains('open')) closeSummary();
            else stop();
          }
          if (e.code === 'Space' && e.target === document.body) {
            e.preventDefault();
            S.running ? stop() : start();
          }
        });

        function tick(now) {
          if (!S.running) {
            S.breath = 0;
            S.elapsed = 0;
            return;
          }
          const sinceStart = (now - S.startedAt) / 1000;
          if (sinceStart < 0) {
            // countdown: settle to empty, count 3-2-1
            S.breath = 0;
            setPhase('Preparate');
            setCount(Math.ceil(-sinceStart));
            setProgress(0);
            return;
          }
          S.elapsed = sinceStart;
          const total = tech.t.reduce((s, v) => s + v, 0);
          const inCycle = sinceStart % total;
          S.cycles = Math.floor(sinceStart / total);
          let acc = 0;
          for (let i = 0; i < 4; i++) {
            const dur = tech.t[i];
            if (!dur) continue;
            if (inCycle < acc + dur) {
              const p = (inCycle - acc) / dur;
              const ph = PHASES[i];
              S.breath = ph.from + (ph.to - ph.from) * ease(p);
              setPhase(ph.label);
              setCount(dur >= 2 ? Math.ceil(dur - (inCycle - acc)) : null);
              break;
            }
            acc += dur;
          }
          setProgress(inCycle / total);
          $('#s-time').textContent = fmt(sinceStart);
          $('#s-cycle').textContent = S.cycles + 1;
          if (duration.min && sinceStart >= duration.min * 60) stop(true);
        }
        function setProgress(p) {
          trail.style.strokeDasharray = `${p} 1`;
          const a = p * Math.PI * 2 - Math.PI / 2;
          comet.setAttribute('cx', (100 + 99 * Math.cos(a)).toFixed(2));
          comet.setAttribute('cy', (100 + 99 * Math.sin(a)).toFixed(2));
        }
        const fmt = (s) =>
          `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

        /* ── Summary ───────────────────────────────────────────────── */
        function openSummary(secs) {
          $('#sum-text').textContent =
            `${fmt(secs)} · ${S.cycles} ${S.cycles === 1 ? 'ciclo' : 'ciclos'} · ${tech.name}`;
          splitInto($('#sum-title'), 'Bien hecho.', 45, 250);
          $('#summary').classList.add('open');
          setTimeout(() => $('#again').focus(), 50);
        }
        function closeSummary() {
          $('#summary').classList.remove('open');
        }
        $('#again').addEventListener('click', start);
        $('#close').addEventListener('click', () => {
          closeSummary();
          orb.focus();
        });

        /* ── Sound: a soft drone that breathes, plus air ───────────── */
        const audio = {
          on: false,
          ctx: null,
          ensure() {
            if (!this.on || this.ctx) return;
            const ctx = (this.ctx = new (window.AudioContext ||
              window.webkitAudioContext)());
            const master = (this.master = ctx.createGain());
            master.gain.value = 0;
            master.connect(ctx.destination);
            const lp = (this.lp = ctx.createBiquadFilter());
            lp.type = 'lowpass';
            lp.frequency.value = 400;
            lp.Q.value = 0.6;
            lp.connect(master);
            [110, 164.81, 220.6, 329.63].forEach((f, i) => {
              const o = ctx.createOscillator();
              o.type = i === 3 ? 'triangle' : 'sine';
              o.frequency.value = f;
              const g = ctx.createGain();
              g.gain.value = [0.5, 0.32, 0.22, 0.05][i];
              o.connect(g).connect(lp);
              o.start();
            });
            // air: filtered noise, louder while the breath moves
            const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++)
              data[i] = Math.random() * 2 - 1;
            const n = ctx.createBufferSource();
            n.buffer = buf;
            n.loop = true;
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = 900;
            bp.Q.value = 0.7;
            const air = (this.air = ctx.createGain());
            air.gain.value = 0;
            n.connect(bp).connect(air).connect(ctx.destination);
            n.start();
          },
          update(b, v) {
            if (!this.ctx) return;
            const t = this.ctx.currentTime;
            this.master.gain.setTargetAtTime(
              this.on ? 0.035 + 0.035 * b : 0,
              t,
              0.3,
            );
            this.lp.frequency.setTargetAtTime(320 + 1100 * b, t, 0.2);
            this.air.gain.setTargetAtTime(
              this.on && S.running ? Math.min(Math.abs(v) * 0.05, 0.03) : 0,
              t,
              0.15,
            );
          },
        };
        $('#sound').addEventListener('click', (e) => {
          audio.on = !audio.on;
          e.currentTarget.setAttribute('aria-pressed', String(audio.on));
          document.body.classList.toggle('sound-on', audio.on);
          audio.ensure();
          audio.ctx?.resume();
        });

        /* ── WebGL aurora + lens ───────────────────────────────────── */
        const canvas = $('#aurora');
        const gl = canvas.getContext('webgl', {
          antialias: false,
          alpha: false,
        });
        let prog, U;
        const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
        const FRAG = `
          precision highp float;
          uniform vec2 uRes; uniform float uTime, uBreath, uIntro, uPulse;
          uniform vec3 uOrb; uniform vec2 uMouse;
          const vec3 CREAM = vec3(.980,.965,.941);
          const vec3 SKY = vec3(.663,.816,.886);
          const vec3 SKY_DEEP = vec3(.45,.69,.80);
          const vec3 PEACH = vec3(.945,.835,.745);
          const vec3 MINT = vec3(.79,.90,.86);
          float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
          float noise(vec2 p){
            vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
            return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y);
          }
          float fbm(vec2 p){
            float v = 0., a = .5; mat2 m = mat2(1.6,1.2,-1.2,1.6);
            for(int i=0;i<4;i++){ v += a*noise(p); p = m*p; a *= .5; }
            return v;
          }
          // The landing's aura, alive: domain-warped noise mapped onto
          // sky (top-left) → cream → peach (bottom-right), a breath of mint
          vec3 field(vec2 frag){
            vec2 uv = frag/uRes;
            vec2 p = (frag - .5*uRes)/uRes.y + uMouse*.035;
            float t = uTime;
            vec2 q = vec2(fbm(p*1.2 + vec2(0., t*.030)), fbm(p*1.2 + vec2(5.2,1.3) - t*.025));
            vec2 r = vec2(fbm(p*1.4 + 1.8*q + vec2(1.7,9.2) + t*.020), fbm(p*1.4 + 1.8*q + vec2(8.3,2.8) - t*.020));
            float f = fbm(p*.9 + 1.4*r);
            float tz = clamp(.56 + (uv.x - uv.y)*.62 + (f - .5)*1.0, 0., 1.);
            vec3 col = CREAM;
            col = mix(col, SKY, (1. - smoothstep(.06, .46, tz))*(.7 + .3*q.x));
            col = mix(col, PEACH, smoothstep(.62, 1., tz)*.85);
            col = mix(col, MINT, smoothstep(.55, .85, r.y)*.22*(1. - abs(tz - .5)*2.));
            col = mix(col, SKY_DEEP, smoothstep(.62, .9, f)*(1. - smoothstep(0., .5, tz))*.45);
            return col;
          }
          vec3 sat(vec3 c, float s){ return mix(vec3(dot(c, vec3(.299,.587,.114))), c, s); }
          void main(){
            vec2 frag = gl_FragCoord.xy;
            vec2 c = uOrb.xy; float R = uOrb.z;
            vec2 dv = frag - c; float d = length(dv)/R;
            float inside = 1. - smoothstep(.985, 1., d);
            vec3 col;
            if (d < 1.02 && uBreath > .002) {
              // the lens: magnify the light inside, split it at the rim
              float k = mix(1., .78 + .2*d*d, uBreath);
              float ca = .03*uBreath*d*d*d;
              vec3 a = field(c + dv*(k + ca));
              vec3 b = field(c + dv*k);
              vec3 e = field(c + dv*(k - ca));
              vec3 lens = sat(vec3(a.r, b.g, e.b), 1. + .45*uBreath);
              lens = mix(lens, lens*vec3(.96,1.,1.03), .5*uBreath);
              vec3 bg = d > .97 ? field(frag) : lens;
              col = mix(bg, lens, inside);
            } else {
              col = field(frag);
            }
            col += vec3(1.)*.09*uBreath*smoothstep(.86, 1., d)*inside;           // light gathering at the rim
            float halo = exp(-max(d - 1., 0.)*5.)*(1. - inside);
            col = mix(col, vec3(1., .985, .96), .18*uBreath*halo);               // soft bloom outside
            if (uPulse >= 0.) {                                                  // a ripple on start / end
              float w = exp(-pow((d - (1. + uPulse*2.4))*2.2, 2.))*(1. - clamp(uPulse/1.8, 0., 1.));
              col = mix(col, vec3(1.), w*.32);
            }
            col = mix(CREAM, col, uIntro);
            col += (hash(frag + fract(uTime)*100.) - .5)*.014;                    // grain: no banding
            gl_FragColor = vec4(col, 1.);
          }`;
        function compile(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            throw new Error(gl.getShaderInfoLog(s));
          return s;
        }
        try {
          if (!gl) throw new Error('no webgl');
          prog = gl.createProgram();
          gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
          gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
            throw new Error(gl.getProgramInfoLog(prog));
          gl.useProgram(prog);
          const buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 3, -1, -1, 3]),
            gl.STATIC_DRAW,
          );
          const loc = gl.getAttribLocation(prog, 'p');
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
          U = {};
          [
            'uRes',
            'uTime',
            'uBreath',
            'uIntro',
            'uPulse',
            'uOrb',
            'uMouse',
          ].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
        } catch (err) {
          console.warn('Aurora fallback:', err.message);
          document.documentElement.classList.add('no-gl');
          prog = null;
        }

        /* ── Motes: dust in the light ──────────────────────────────── */
        const mc = $('#motes');
        const mx = mc.getContext('2d');
        const MOTES = Array.from({ length: 90 }, () => ({
          a: Math.random() * Math.PI * 2,
          w: (Math.random() * 0.06 + 0.015) * (Math.random() < 0.5 ? -1 : 1),
          s: Math.random(),
          z: Math.random() * 1.6 + 0.6,
          ph: Math.random() * Math.PI * 2,
          tint: Math.random(),
        }));

        /* ── Sizing ────────────────────────────────────────────────── */
        let W = 0,
          H = 0,
          renderScale = 1,
          dpr = 1;
        function resize() {
          W = innerWidth;
          H = innerHeight;
          dpr = Math.min(devicePixelRatio || 1, 2);
          renderScale = Math.min(dpr, 1.5) * 0.7; // the aura is soft: render it below full res
          canvas.width = Math.round(W * renderScale);
          canvas.height = Math.round(H * renderScale);
          mc.width = Math.round(W * dpr);
          mc.height = Math.round(H * dpr);
          if (prog) gl.viewport(0, 0, canvas.width, canvas.height);
          moveThumb();
        }
        addEventListener('resize', resize);

        /* Pointer: the light leans gently toward it */
        const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
        addEventListener('pointermove', (e) => {
          mouse.tx = (e.clientX / W - 0.5) * 2;
          mouse.ty = (0.5 - e.clientY / H) * 2;
        });

        let pulseAt = -1;
        function pulse() {
          pulseAt = performance.now();
        }

        /* ── Frame ─────────────────────────────────────────────────── */
        const t0 = performance.now();
        let last = t0,
          time = 0;
        function frame(now) {
          const dt = Math.min((now - last) / 1000, 0.05);
          last = now;
          time += dt * (reduced ? 0.15 : 1);
          tick(now);

          // smoothing: tight while breathing, lazy at rest
          const prev = S.shown;
          S.shown +=
            (S.breath - S.shown) * (1 - Math.exp(-dt * (S.running ? 14 : 3)));
          S.velocity = (S.shown - prev) / Math.max(dt, 1e-3);
          const idle = S.running ? 0 : Math.sin(now / 1600) * 0.012; // alive at rest
          const target = S.running ? 0.72 + 0.4 * S.shown : 0.86 + idle;
          S.scale +=
            (target - S.scale) * (1 - Math.exp(-dt * (S.running ? 14 : 4)));
          ring.style.setProperty('--s', S.scale.toFixed(4));
          const b = S.shown;
          const mix = (x, y) => Math.round(x + (y - x) * b);
          ringBase.style.stroke = `rgba(${mix(62, 255)},${mix(113, 255)},${mix(137, 255)},${(0.42 + 0.45 * b).toFixed(3)})`;

          mouse.x += (mouse.tx - mouse.x) * 0.04;
          mouse.y += (mouse.ty - mouse.y) * 0.04;

          const r = orb.getBoundingClientRect();
          const cx = r.left + r.width / 2,
            cy = r.top + r.height / 2;
          const R = (r.width / 2) * S.scale;

          if (prog) {
            const intro = Math.min((now - t0) / 1800, 1);
            gl.uniform2f(U.uRes, canvas.width, canvas.height);
            gl.uniform1f(U.uTime, time);
            gl.uniform1f(U.uBreath, b);
            gl.uniform1f(U.uIntro, 1 - Math.pow(1 - intro, 3));
            gl.uniform1f(U.uPulse, pulseAt < 0 ? -1 : (now - pulseAt) / 1000);
            gl.uniform3f(
              U.uOrb,
              cx * renderScale,
              (H - cy) * renderScale,
              R * renderScale,
            );
            gl.uniform2f(U.uMouse, mouse.x, mouse.y);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
          }

          // motes: drawn toward the rim on the inhale, released on the exhale
          if (!reduced) {
            mx.setTransform(dpr, 0, 0, dpr, 0, 0);
            mx.clearRect(0, 0, W, H);
            const vis = S.running ? 1 : 0.35;
            for (const m of MOTES) {
              m.a += m.w * dt * (1 + b * 0.8);
              const spread = 1.12 + m.s * 1.6 * (1 - 0.72 * b);
              const wob = Math.sin(now / 1000 + m.ph) * 6;
              const d = R * spread + wob;
              const x = cx + Math.cos(m.a) * d,
                y = cy + Math.sin(m.a) * d;
              const al =
                (0.25 + 0.5 * (0.5 + 0.5 * Math.sin(now / 900 + m.ph))) *
                vis *
                (1 - m.s * 0.5);
              const tint =
                m.tint < 0.5
                  ? '255,255,255'
                  : m.tint < 0.8
                    ? '200,228,240'
                    : '250,222,200';
              mx.beginPath();
              mx.fillStyle = `rgba(${tint},${al.toFixed(3)})`;
              mx.arc(x, y, m.z, 0, Math.PI * 2);
              mx.fill();
            }
          }

          audio.update(b, S.velocity);
          requestAnimationFrame(frame);
        }

        /* ── Boot ──────────────────────────────────────────────────── */
        splitInto($('#wordmark'), 'Neyen', 90, 300);
        chooseTechnique(tech);
        pulseAt = -1; // no ripple on load
        setPhase('Tocá para empezar', true);
        resize();
        requestAnimationFrame(moveThumb);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
