<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf6f0" />
    <meta name="robots" content="noindex" />
    <title>Neyen · el arte de respirar</title>
    <style>
      /* ─────────────────────────────────────────────────────────────
         Neyen · concept "Lente"
         A design proposal, not the app. One file, no dependencies.
         Layers, back to front:
           1. #aurora  WebGL: a living version of the landing's hero aura.
              The breathing circle is a lens inside it: at rest invisible,
              on the inhale it magnifies, saturates and splits the light
              at its rim (a prism) — the background itself condenses.
           2. #motes   Canvas: dust in the light, drawn in on the inhale,
              released on the exhale.
           3. The DOM: ring, progress comet, type, glass UI.
         ───────────────────────────────────────────────────────────── */
      :root {
        --cream: #faf6f0;
        --ink: #22303a;
        --ink-soft: #46555c;
        --accent: #3e7189;
        --sky: #a9d0e2;
        --peach: #f1d9c4;
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino,
          'Book Antiqua', Georgia, serif;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-breath: cubic-bezier(0.37, 0, 0.63, 1);
        --glass: rgba(255, 253, 249, 0.42);
        --glass-border: rgba(255, 255, 255, 0.65);
        /* the circle gives way first on short screens */
        --orb: min(72vw, 330px, max(150px, calc(100svh - 400px)));
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      /* The page scrolls to the reading below; a session freezes it */
      body.in-session {
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      /* ── Background layers ───────────────────────────────────────── */
      #aurora,
      #motes {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #motes {
        pointer-events: none;
      }
      /* No WebGL: a static version of the landing aura */
      .no-gl #aurora {
        background: radial-gradient(
            ellipse 60% 50% at 15% 10%,
            var(--sky),
            transparent 70%
          ),
          radial-gradient(
            ellipse 55% 45% at 90% 95%,
            var(--peach),
            transparent 70%
          ),
          var(--cream);
      }

      /* ── Layout ──────────────────────────────────────────────────── */
      .app {
        position: relative;
        height: 100vh;
        height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: max(18px, env(safe-area-inset-top)) 20px
          max(18px, env(safe-area-inset-bottom));
      }

      /* Chrome that steps aside during a session */
      .chrome {
        transition:
          opacity 1.1s var(--ease-out),
          filter 1.1s var(--ease-out),
          transform 1.1s var(--ease-out);
      }
      .in-session .chrome {
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
      }
      .in-session header.chrome {
        transform: translateY(-14px);
      }
      .in-session .dock.chrome {
        transform: translateY(24px);
      }

      /* ── Header ──────────────────────────────────────────────────── */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .wordmark {
        display: flex;
        align-items: baseline;
        gap: 12px;
        text-decoration: none;
        color: var(--ink);
      }
      .wordmark b {
        white-space: nowrap;
        font-family: var(--serif);
        font-weight: 400;
        font-size: 1.55rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }
      .wordmark small {
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .wordmark .l {
        display: inline-block;
        animation: letter-in 1.4s var(--ease-out) both;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: 0 8px 24px -14px rgba(34, 48, 58, 0.35);
        font-size: 0.86rem;
        color: var(--ink);
        text-decoration: none;
        transition:
          background 0.4s,
          transform 0.4s var(--ease-out);
      }
      .pill:hover {
        background: rgba(255, 253, 249, 0.7);
        transform: translateY(-1px);
      }
      /* Equalizer: still when muted, breathing when on */
      .eq {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
      }
      .eq i {
        width: 2px;
        height: 4px;
        border-radius: 1px;
        background: var(--accent);
        transition: height 0.3s;
      }
      .sound-on .eq i {
        animation: eq 1.1s ease-in-out infinite;
      }
      .sound-on .eq i:nth-child(2) {
        animation-delay: -0.4s;
      }
      .sound-on .eq i:nth-child(3) {
        animation-delay: -0.8s;
      }
      @keyframes eq {
        0%,
        100% {
          height: 3px;
        }
        50% {
          height: 12px;
        }
      }

      /* ── Stage: the circle ───────────────────────────────────────── */
      .stage {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 22px;
        min-height: 0;
      }
      .eyebrow {
        margin: 0;
        font-size: 0.74rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ink-soft);
        text-align: center;
        transition: opacity 0.6s;
      }
      .eyebrow em {
        font-style: normal;
        color: var(--accent);
      }
      .orb {
        position: relative;
        width: var(--orb);
        height: var(--orb);
        border: 0;
        padding: 0;
        background: none;
        border-radius: 50%;
        -webkit-tap-highlight-color: transparent;
      }
      .orb:focus-visible {
        outline: 1px solid rgba(62, 113, 137, 0.45);
        outline-offset: 14px;
      }
      .ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        transform: scale(var(--s, 0.86));
        will-change: transform;
      }
      .ring circle {
        vector-effect: non-scaling-stroke;
        fill: none;
      }
      .ring .base {
        stroke: rgba(62, 113, 137, 0.42);
        stroke-width: 1;
        stroke-dasharray: 1 1;
        animation: draw 2.4s var(--ease-out) 0.35s both;
      }
      .ring .trail {
        stroke: #fff;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-dasharray: 0 1;
        opacity: 0;
        transition: opacity 0.8s;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.9));
      }
      .ring .tick {
        fill: rgba(62, 113, 137, 0.55);
        opacity: 0;
        transition: opacity 0.8s;
      }
      .ring .comet {
        fill: #fff;
        opacity: 0;
        transition: opacity 0.8s;
        filter: drop-shadow(0 0 6px #fff)
          drop-shadow(0 0 14px rgba(169, 208, 226, 0.9));
      }
      .in-session .ring .trail,
      .in-session .ring .comet,
      .in-session .ring .tick {
        opacity: 1;
      }
      @keyframes draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Type inside the circle (not scaled with it) */
      .orb-text {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 4px;
        pointer-events: none;
        text-align: center;
      }
      .phase {
        min-height: 1.3em;
        font-family: var(--serif);
        /* sized from the circle, so the longest word ("Breathe out") fits
           even when the circle is at its smallest */
        font-size: clamp(1rem, calc(var(--orb) * 0.1), 1.9rem);
        letter-spacing: 0.06em;
        white-space: nowrap;
        color: var(--ink);
      }
      .phase.hint {
        font-style: italic;
        font-size: 1.15rem;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
      }
      .phase .l {
        display: inline-block;
        white-space: pre;
        animation: letter-in 0.9s var(--ease-out) both;
      }
      .phase.out .l {
        animation: letter-out 0.28s ease-in both;
      }
      .count {
        min-height: 1.2em;
        font-family: var(--sans);
        font-weight: 200;
        font-size: clamp(2.6rem, 11vw, 3.6rem);
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .count span {
        display: inline-block;
        animation: num-in 0.7s var(--ease-out) both;
      }
      @keyframes letter-in {
        from {
          opacity: 0;
          filter: blur(8px);
          transform: translateY(0.35em);
        }
      }
      @keyframes letter-out {
        to {
          opacity: 0;
          filter: blur(6px);
          transform: translateY(-0.25em);
        }
      }
      @keyframes num-in {
        from {
          opacity: 0;
          filter: blur(10px);
          transform: scale(0.82);
        }
      }

      .meta {
        display: flex;
        gap: 18px;
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .meta b {
        font-weight: 500;
        color: var(--ink);
      }

      /* ── Dock: techniques + duration ─────────────────────────────── */
      .dock {
        display: grid;
        gap: 14px;
        justify-items: center;
      }
      .cards {
        display: flex;
        gap: 12px;
        width: min(100%, 860px);
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 6px 4px 10px;
        scrollbar-width: none;
      }
      .cards::-webkit-scrollbar {
        display: none;
      }
      .card {
        --rx: 0deg;
        --ry: 0deg;
        --mx: 50%;
        --my: 0%;
        position: relative;
        flex: 0 0 196px;
        scroll-snap-align: center;
        display: grid;
        gap: 6px;
        padding: 14px 16px 12px;
        text-align: left;
        border-radius: 20px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: 0 14px 34px -22px rgba(34, 48, 58, 0.45);
        transform: perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));
        transition:
          transform 0.6s var(--ease-out),
          box-shadow 0.6s,
          border-color 0.6s;
        overflow: hidden;
        animation: rise 1.2s var(--ease-out) backwards;
      }
      .card::after {
        /* sheen that follows the pointer */
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          240px circle at var(--mx) var(--my),
          rgba(255, 255, 255, 0.55),
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }
      .card:hover::after {
        opacity: 1;
      }
      .card.tilting {
        transition:
          box-shadow 0.6s,
          border-color 0.6s;
      }
      .card[aria-pressed='true'] {
        border-color: rgba(62, 113, 137, 0.55);
        box-shadow:
          0 0 0 1px rgba(62, 113, 137, 0.25),
          0 18px 40px -20px rgba(62, 113, 137, 0.55);
      }
      .card .goal {
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .card .name {
        font-family: var(--serif);
        font-size: 1.12rem;
        color: var(--ink);
      }
      .card .timing {
        font-size: 0.74rem;
        letter-spacing: 0.14em;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .card svg {
        width: 100%;
        height: 38px;
        overflow: visible;
      }
      .card svg path {
        fill: none;
        stroke: rgba(62, 113, 137, 0.35);
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .card svg circle {
        fill: var(--accent);
        opacity: 0.35;
      }
      .card[aria-pressed='true'] svg path {
        stroke: rgba(62, 113, 137, 0.75);
      }
      .card[aria-pressed='true'] svg circle {
        opacity: 1;
        filter: drop-shadow(0 0 4px rgba(62, 113, 137, 0.6));
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(26px);
          filter: blur(6px);
        }
      }

      .segmented {
        position: relative;
        display: inline-flex;
        padding: 4px;
        border-radius: 999px;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        animation: rise 1.2s var(--ease-out) 0.55s backwards;
      }
      .segmented .thumb {
        position: absolute;
        top: 4px;
        bottom: 4px;
        left: 0;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 4px 14px -6px rgba(34, 48, 58, 0.35);
        transition:
          transform 0.6s var(--ease-out),
          width 0.6s var(--ease-out);
      }
      .segmented button {
        position: relative;
        z-index: 1;
        min-width: 54px;
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: none;
        font-size: 0.84rem;
        color: var(--ink-soft);
        transition: color 0.4s;
      }
      .segmented button[aria-pressed='true'] {
        color: var(--ink);
        font-weight: 500;
      }

      /* ── Session-only meta ───────────────────────────────────────── */
      .session-meta {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(28px, env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 1s var(--ease-out) 0.4s,
          transform 1s var(--ease-out) 0.4s;
        pointer-events: none;
      }
      .in-session .session-meta {
        opacity: 1;
        transform: none;
      }
      .session-meta small {
        display: block;
        margin-top: 6px;
        text-align: center;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: none;
        color: var(--ink-soft);
      }

      /* ── Summary ─────────────────────────────────────────────────── */
      .summary {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(250, 246, 240, 0.25);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.8s var(--ease-out),
          visibility 0s 0.8s;
      }
      .summary.open {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s var(--ease-out);
      }
      .summary .sheet {
        width: min(100%, 380px);
        padding: 34px 30px 26px;
        border-radius: 28px;
        border: 1px solid var(--glass-border);
        background: rgba(255, 253, 249, 0.62);
        -webkit-backdrop-filter: blur(24px) saturate(1.5);
        backdrop-filter: blur(24px) saturate(1.5);
        box-shadow: 0 30px 70px -30px rgba(34, 48, 58, 0.5);
        text-align: center;
        transform: translateY(30px) scale(0.96);
        filter: blur(8px);
        transition:
          transform 1s var(--ease-out),
          filter 1s var(--ease-out);
      }
      .summary.open .sheet {
        transform: none;
        filter: none;
      }
      .summary h2 {
        margin: 0 0 8px;
        font-family: var(--serif);
        font-weight: 400;
        font-size: 2.1rem;
      }
      .summary p {
        margin: 0 0 24px;
        color: var(--ink-soft);
        letter-spacing: 0.06em;
      }
      .summary .row {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .btn {
        height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        font-size: 0.92rem;
        transition:
          transform 0.4s var(--ease-out),
          background 0.3s;
      }
      .btn:hover {
        transform: translateY(-1px);
        background: #2e5a6f;
      }
      .btn.ghost {
        background: transparent;
        color: var(--accent);
      }
      .btn.ghost:hover {
        background: rgba(62, 113, 137, 0.08);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (max-width: 560px) {
        .wordmark small {
          display: none;
        }
        .wordmark b {
          font-size: 1.25rem;
          letter-spacing: 0.26em;
        }
        .card {
          flex-basis: 172px;
          padding: 12px 14px 10px;
        }
      }
      @media (max-height: 700px) {
        .card svg {
          height: 24px;
        }
        .stage {
          gap: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
        }
        #motes {
          display: none;
        }
      }

      /* ── Sound panel ─────────────────────────────────────────────── */
      .actions {
        position: relative;
      }
      .popover {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        z-index: 5;
        width: 270px;
        padding: 16px 18px 18px;
        border-radius: 22px;
        border: 1px solid var(--glass-border);
        background: rgba(255, 253, 249, 0.72);
        -webkit-backdrop-filter: blur(24px) saturate(1.5);
        backdrop-filter: blur(24px) saturate(1.5);
        box-shadow: 0 24px 60px -24px rgba(34, 48, 58, 0.45);
        transform-origin: top right;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px) scale(0.97);
        filter: blur(6px);
        transition:
          opacity 0.45s var(--ease-out),
          transform 0.45s var(--ease-out),
          filter 0.45s var(--ease-out),
          visibility 0s 0.45s;
      }
      .popover.open {
        opacity: 1;
        visibility: visible;
        transform: none;
        filter: none;
        transition:
          opacity 0.45s var(--ease-out),
          transform 0.45s var(--ease-out),
          filter 0.45s var(--ease-out);
      }
      .popover h3 {
        margin: 0 0 10px;
        font-family: var(--serif);
        font-weight: 400;
        font-size: 1.1rem;
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 9px 0;
        border: 0;
        border-bottom: 1px solid rgba(34, 48, 58, 0.08);
        background: none;
        font-size: 0.9rem;
        text-align: left;
      }
      .switch-row small {
        display: block;
        font-size: 0.72rem;
        color: var(--ink-soft);
      }
      .switch {
        position: relative;
        flex: none;
        width: 40px;
        height: 24px;
        border-radius: 999px;
        background: rgba(34, 48, 58, 0.16);
        transition: background 0.35s;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 6px rgba(34, 48, 58, 0.25);
        transition: transform 0.45s var(--ease-out);
      }
      [aria-checked='true'] .switch {
        background: var(--accent);
      }
      [aria-checked='true'] .switch::after {
        transform: translateX(16px);
      }
      .volume {
        display: grid;
        gap: 8px;
        margin-top: 14px;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .volume input {
        width: 100%;
        accent-color: var(--accent);
      }

      /* ── Safety note ─────────────────────────────────────────────── */
      .card .warn {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 0.72rem;
        line-height: 1.35;
        color: #8a4b26;
      }
      .overlay .sheet h2.small {
        font-size: 1.5rem;
      }
      .overlay .sheet .note {
        margin: 0 0 22px;
        line-height: 1.55;
        letter-spacing: 0;
        color: var(--ink);
        text-align: left;
      }

      /* ── Link down to the reading ────────────────────────────────── */
      .more {
        justify-self: center;
        margin-top: 4px;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
        text-decoration: none;
        transition: color 0.3s;
      }
      .more:hover {
        color: var(--accent);
      }

      /* ── Cards: an info button beside each ──────────────────────── */
      .card-wrap {
        position: relative;
        isolation: isolate; /* keeps the info button under the dialogs */
        /* the card and its info button rise in together */
        animation: rise 1.2s var(--ease-out) backwards;
        flex: 0 0 196px;

      /* ── Overlays with longer text ──────────────────────────────── */

      /* ── Summary: mood, streak, next steps ──────────────────────── */
      .mood fieldset {
        margin: 0 0 22px;

      }
      .mood legend {
        margin: 0 auto 10px;

      }
      .mood .dots {
        display: flex;

      }
      .mood .dots button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(62, 113, 137, 0.4);
        background: rgba(255, 255, 255, 0.5);
        font-size: 0.8rem;
        color: var(--ink-soft);
        cursor: pointer;
        transition:
          background 0.3s,
          transform 0.4s var(--ease-out),

      }
      .mood .dots button:hover {
        transform: scale(1.1);
      }
      .mood .dots button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .mood .ends {
        display: flex;
        justify-content: space-between;
        width: 214px;
        margin: 6px auto 0;
        font-size: 0.7rem;
        color: var(--ink-soft);
      }
      .mood .thanks {
        min-height: 1.2em;

        font-size: 0.78rem;
        color: var(--accent) !important;

      .sum-links {
        display: grid;
        gap: 8px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid rgba(34, 48, 58, 0.08);
        font-size: 0.86rem;
      }
      .sum-links a {
        color: var(--accent);
        text-decoration: none;
      }
      .sum-links a:hover {
        text-decoration: underline;
      }
      .overlay .sheet .streak {
        margin: -12px 0 20px;
        font-size: 0.76rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .overlay .sheet .streak:empty {
        display: none;
      }

      /* ── Help ───────────────────────────────────────────────────── */
      .popover p {
        margin: 0 0 10px;
        font-size: 0.88rem;
        line-height: 1.55;
      }
      .popover kbd {
        padding: 1px 6px;
        border-radius: 6px;
        border: 1px solid rgba(34, 48, 58, 0.18);
        background: #fff;
        font-family: var(--sans);
        font-size: 0.76rem;
      }

      /* ── Reading: what Neyen is, the techniques, FAQ, author ────── */
      .info {
        position: relative;
        width: min(100% - 32px, 680px);
        margin: 0 auto 64px;
        padding: 36px clamp(20px, 5vw, 48px) 40px;
        border-radius: 28px;
        border: 1px solid var(--glass-border);
        background: rgba(255, 253, 249, 0.7);
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        backdrop-filter: blur(24px) saturate(1.3);
        box-shadow: 0 30px 70px -40px rgba(34, 48, 58, 0.4);
        line-height: 1.7;
      }
      .info h2 {
        margin: 36px 0 12px;
        font-family: var(--serif);

        margin-top: 0;

      }

        border-radius: 18px;

      }
    </style>
  </head>
  <body>
    <canvas id="aurora" aria-hidden="true"></canvas>
    <canvas id="motes" aria-hidden="true"></canvas>

    <div class="app">
      <header class="chrome">
        <a class="wordmark" href="../light.html" data-t-label="back">
          <b id="wordmark">Neyen</b>
          <small data-t="tagline"></small>
        </a>
        <div class="actions">
          <button class="pill" id="lang" lang="en"></button>
          <button
            class="pill"
            id="help"
            aria-expanded="false"

            data-t-label="helpTitle"
          >
            ?
          </button>
          <div
            class="popover"
            id="help-panel"

          >
            <h3 id="help-title" data-t="helpTitle"></h3>

      <section class="dock chrome" data-t-label="dock">

    <!-- The reading under the app: same copy as the app, from seo-content.js -->

    <div class="session-meta" aria-hidden="true">
      <div class="meta">
        <span><b id="s-time">00:00</b></span
        ><span><span data-t="cycle"></span> <b id="s-cycle">1</b></span>

    <!-- Safety note: shown once per technique, before its first session -->
    <div

    >
      <div class="sheet">

      <div class="sheet text">

        <div class="row">
          <button class="btn" id="info-go" data-t="infoGo"></button>
          <button class="btn ghost" id="info-close" data-t="close"></button>
        </div>

    <script type="module">
      // Techniques come from the app itself: one source for names, rhythms,
      // safety notes and sound folders.
      import { PRESETS, GOALS } from '../assets/js/presets.js';
      // …and so do the practice history, the reminder and the reading
      import {
        addSession,
        setMoodAfter,
        getStats,
        MIN_RECORDED_SECS,
      } from '../assets/js/history.js';
      import { googleCalendarUrl } from '../assets/js/reminder-ics.js';
      import { SEO, AUTHOR, renderSeo } from '../assets/js/seo-content.js';

      const $ = (s) => document.querySelector(s);
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const store = {
        get(k, d) {
          try {
            const v = localStorage.getItem(`neyen.${k}`);
            return v == null ? d : JSON.parse(v);
          } catch {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(`neyen.${k}`, JSON.stringify(v));
          } catch {}
        },
      };

      /* ── Language ──────────────────────────────────────────────────── */
      const STR = {
        es: {
          title: 'Neyen · el arte de respirar',
          tagline: 'el arte de respirar',
          back: 'Neyen, volver a la app',
          tap: 'Tocá para empezar',
          getReady: 'Preparate',
          phases: ['Inhalá', 'Sostené', 'Exhalá', 'Pausa'],
          sound: 'Sonido',
          volume: 'Volumen',
          channels: {
            voice: ['Voz guía', 'Los primeros ciclos'],
            cues: ['Avisos de fase', 'Marcan cada cambio'],
            breath: ['Respiración', 'El aire que entra y sale'],
            music: ['Música', 'De fondo, siempre'],
          },
          goals: {
            calm: 'Calma',
            focus: 'Foco',
            sleep: 'Sueño',
            energy: 'Energía',
          },
          infinite: 'Sin límite',
          cycle: 'ciclo',
          cycles: (n) => `${n} ${n === 1 ? 'ciclo' : 'ciclos'}`,
          done: 'Bien hecho.',
          again: 'Otra vez',
          close: 'Cerrar',
          warnTitle: 'Antes de empezar',
          warnGo: 'Entendido, empezar',
          warnCancel: 'Ahora no',
          start: 'Empezar',
          stop: 'Terminar la sesión',
          dock: 'Técnica y duración',
          techniques: 'Técnicas',
          duration: 'Duración',
          srHint:
            'Tocá el círculo o pulsá la barra espaciadora para empezar o terminar.',
          other: 'EN',
          otherLabel: 'English',
          more: 'Qué es Neyen, las técnicas y preguntas ↓',
          helpTitle: 'Cómo funciona',
          help: [
            'Elegí una técnica abajo. Tocá el círculo y seguilo: crece cuando inhalás, se achica cuando exhalás.',
            'Una voz te acompaña los primeros ciclos. Si preferís silencio, apagala en Sonido.',
            'Tocá el círculo otra vez para terminar.',
          ],
          keys: '<kbd>Espacio</kbd> empezar o terminar · <kbd>Esc</kbd> salir',
          info: (n) => `Sobre ${n}`,
          infoGo: 'Empezar con esta',
          moodQ: '¿Cómo te sentís ahora?',
          moodEnds: ['Peor', 'Mucho mejor'],
          moodThanks: 'Gracias. Queda guardado en tu práctica.',
          streak: (n) =>
            n > 1 ? `${n} días seguidos` : 'Primer día de tu racha',
          reminder: 'Agregá un recordatorio diario →',
          coach: '¿Querés ir más profundo? Sesiones 1:1 →',
        },
        en: {
          title: 'Neyen · the art of breathing',
          tagline: 'the art of breathing',
          back: 'Neyen, back to the app',
          tap: 'Tap to begin',
          getReady: 'Get ready',
          phases: ['Breathe in', 'Hold', 'Breathe out', 'Rest'],
          sound: 'Sound',
          volume: 'Volume',
          channels: {
            voice: ['Voice guide', 'The first cycles'],
            cues: ['Phase cues', 'Mark every change'],
            breath: ['Breathing', 'The air coming in and out'],
            music: ['Music', 'In the background'],
          },
          goals: {
            calm: 'Calm',
            focus: 'Focus',
            sleep: 'Sleep',
            energy: 'Energy',
          },
          infinite: 'No limit',
          cycle: 'cycle',
          cycles: (n) => `${n} ${n === 1 ? 'cycle' : 'cycles'}`,
          done: 'Well done.',
          again: 'Again',
          close: 'Close',
          warnTitle: 'Before you start',
          warnGo: 'Got it, start',
          warnCancel: 'Not now',
          start: 'Start',
          stop: 'End the session',
          dock: 'Technique and duration',
          techniques: 'Techniques',
          duration: 'Duration',
          srHint: 'Tap the circle or press the space bar to start or stop.',
          other: 'ES',
          otherLabel: 'Español',
          more: 'What Neyen is, the techniques and FAQ ↓',
          helpTitle: 'How it works',
          help: [
            'Choose a technique below. Tap the circle and follow it: it grows as you breathe in and shrinks as you breathe out.',
            'A voice guides you through the first cycles. For silence, turn it off in Sound.',
            'Tap the circle again to finish.',
          ],
          keys: '<kbd>Space</kbd> start or stop · <kbd>Esc</kbd> exit',
          info: (n) => `About ${n}`,
          infoGo: 'Start with this one',
          moodQ: 'How do you feel now?',
          moodEnds: ['Worse', 'Much better'],
          moodThanks: 'Thanks. It is saved in your practice.',
          streak: (n) =>
            n > 1 ? `${n} days in a row` : 'Day one of your streak',
          reminder: 'Add a daily reminder →',
          coach: 'Want to go deeper? 1:1 sessions →',
        },
      };
      let lang =
        store.get('lang', null) ??
        ((navigator.language || 'es').startsWith('es') ? 'es' : 'en');
      if (!STR[lang]) lang = 'es';
      const T = () => STR[lang];
      const L = (p, field) => p[`${field}${lang === 'es' ? 'Es' : 'En'}`];

      /* ── Techniques, in the app's goal order ───────────────────────── */
      const TECHNIQUES = GOALS.flatMap((g) =>
        PRESETS.filter((p) => p.goal === g.id),
      );
      const DURATIONS = [0, 3, 5, 10];
      const PHASE_SHAPE = [
        { from: 0, to: 1 },
        { from: 1, to: 1 },
        { from: 1, to: 0 },
        { from: 0, to: 0 },
      ];
      let tech =
        TECHNIQUES.find(
          (p) => p.soundDir === store.get('concept.tech', 'coherent'),
        ) ?? TECHNIQUES[0];
      let duration = store.get('concept.duration', 0);
      if (!DURATIONS.includes(duration)) duration = 0;

      /* ── Type: words that arrive letter by letter ──────────────────── */
      function splitInto(el, text, step = 38, delay = 0) {
        el.textContent = '';
        [...text].forEach((ch, i) => {
          const s = document.createElement('span');
          s.className = 'l';
          s.textContent = ch;
          s.style.animationDelay = `${delay + i * step}ms`;
          el.appendChild(s);
        });
      }
      const phaseEl = $('#phase');
      const countEl = $('#count');
      let phaseText = '';
      let phaseSwap = 0;
      function setPhase(text, hint = false) {
        if (text === phaseText) return;
        phaseText = text;
        clearTimeout(phaseSwap);
        const apply = () => {
          phaseEl.classList.remove('out');
          phaseEl.classList.toggle('hint', hint);
          splitInto(phaseEl, text, hint ? 18 : 42);
        };
        if (phaseEl.textContent) {
          phaseEl.classList.add('out');
          phaseSwap = setTimeout(apply, 240);
        } else apply();
      }
      let countText = '';
      function setCount(n) {
        const t = n == null ? '' : String(n);
        if (t === countText) return;
        countText = t;
        countEl.innerHTML = t ? `<span>${t}</span>` : '';
      }

      /* ── Dock: technique cards with a live rhythm diagram ──────────── */
      function rhythmPath([a, b, c, d]) {
        const total = a + b + c + d;
        const W = 120,
          top = 6,
          bot = 32;
        const x = (s) => (s / total) * W;
        let t = 0;
        let p = `M0 ${bot}`;
        const curve = (dur, y0, y1) => {
          const x0 = x(t),
            x1 = x(t + dur);
          const k = (x1 - x0) * 0.42;
          p += ` C${(x0 + k).toFixed(1)} ${y0} ${(x1 - k).toFixed(1)} ${y1} ${x1.toFixed(1)} ${y1}`;
          t += dur;
        };
        const flat = (dur, y) => {
          t += dur;
          p += ` L${x(t).toFixed(1)} ${y}`;
        };
        if (a) curve(a, bot, top);
        if (b) flat(b, top);
        if (c) curve(c, top, bot);
        if (d) flat(d, bot);
        return p;
      }
      const firstSentence = (s) => (s.match(/^[^.]+\./) || [s])[0];
      const cardsEl = $('#cards');
      function renderCards() {
        cardsEl.innerHTML = '';
        TECHNIQUES.forEach((tq, i) => {
          const b = document.createElement('button');
          b.className = 'card';
          b.style.animationDelay = `${0.25 + i * 0.09}s`;
          b.dataset.id = tq.soundDir;
          b.setAttribute('aria-pressed', String(tq === tech));
          const total = tq.timing.reduce((s, v) => s + v, 0);
          const pid = `rp-${tq.soundDir}`;
          const warn = L(tq, 'warn');
          b.innerHTML = `
            <span class="goal">${T().goals[tq.goal]}</span>
            <span class="name">${L(tq, 'name')}</span>
            <svg viewBox="0 0 120 38" aria-hidden="true">
              <path id="${pid}" d="${rhythmPath(tq.timing)}"/>
              <circle r="3"><animateMotion dur="${Math.max(total, 2.4)}s" repeatCount="indefinite"><mpath href="#${pid}"/></animateMotion></circle>
            </svg>
            <span class="timing">${tq.timing.join(' · ')}</span>
            ${warn ? `<span class="warn">⚠ ${firstSentence(warn)}</span>` : ''}`;
          b.addEventListener('click', () => chooseTechnique(tq));
          b.addEventListener('pointermove', (e) => {
            if (reduced) return;
            const r = b.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width,
              py = (e.clientY - r.top) / r.height;
            b.classList.add('tilting');
            b.style.setProperty('--ry', `${(px - 0.5) * 10}deg`);
            b.style.setProperty('--rx', `${(0.5 - py) * 10}deg`);
            b.style.setProperty('--mx', `${px * 100}%`);
            b.style.setProperty('--my', `${py * 100}%`);
          });
          b.addEventListener('pointerleave', () => {
            b.classList.remove('tilting');
            b.style.setProperty('--rx', '0deg');
            b.style.setProperty('--ry', '0deg');
          });
          // the info button sits beside the card, never inside it
          const wrap = document.createElement('div');
          wrap.className = 'card-wrap';
          const info = document.createElement('button');
          info.className = 'info-btn';
          info.textContent = 'i';
          info.setAttribute('aria-label', T().info(L(tq, 'name')));
          info.addEventListener('click', () => openInfo(tq));
          wrap.style.animationDelay = b.style.animationDelay;
          wrap.append(b, info);
          cardsEl.appendChild(wrap);
        });
        // the chosen technique in view in the scrolling row
        const on = cardsEl.querySelector('[aria-pressed="true"]');
        if (on)
          cardsEl.scrollLeft =
            on.parentElement.offsetLeft -
            (cardsEl.clientWidth - on.offsetWidth) / 2;
      }

      const durEl = $('#durations');
      const thumb = $('#thumb');
      function renderDurations() {
        durEl.querySelectorAll('button').forEach((b) => b.remove());
        DURATIONS.forEach((min) => {
          const b = document.createElement('button');
          b.textContent = min ? `${min} min` : '∞';
          if (!min) b.setAttribute('aria-label', T().infinite);
          b.setAttribute('aria-pressed', String(min === duration));
          b.addEventListener('click', () => {
            duration = min;
            store.set('concept.duration', min);
            durEl
              .querySelectorAll('button')
              .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
            moveThumb();
          });
          durEl.appendChild(b);
        });
      }
      function moveThumb() {
        const b = durEl.querySelector('[aria-pressed="true"]');
        if (!b) return;
        thumb.style.width = `${b.offsetWidth}px`;
        thumb.style.transform = `translateX(${b.offsetLeft}px)`;
      }

      const eyebrow = $('#eyebrow');
      function renderEyebrow(animate) {
        eyebrow.innerHTML = `${T().goals[tech.goal]} · <em>${L(tech, 'name')}</em>`;
        if (animate)
          eyebrow.animate(
            [

      /* ── Breath engine ──────────────────────────────────────────────
         One clock: the AudioContext's, so the voice and cue tracks and
         the circle can never drift apart. */
      const ease = (t) =>
        0.5 - 0.5 * Math.cos(Math.PI * Math.min(Math.max(t, 0), 1));
      const S = {
        running: false,
        t0: 0,
        breath: 0,
        shown: 0,
        scale: 0.86,
        cycles: 0,
        elapsed: 0,
        velocity: 0,
        phase: -1,
      };
      const COUNTDOWN = 3;
      const orb = $('#orb');
      const ring = orb.querySelector('.ring');
      const ringBase = ring.querySelector('.base');
      const trail = $('#trail');
      const comet = $('#comet');
      const now = () =>
        sound.ctx ? sound.ctx.currentTime : performance.now() / 1000;

      const warned = new Set(store.get('concept.warned', []));
      function requestStart() {
        if (S.running) return;
        const warn = L(tech, 'warn');
        if (warn && !warned.has(tech.soundDir)) {
          $('#notice-text').textContent = warn;
          openOverlay('#notice', '#notice-go');

      }
      $('#notice-go').addEventListener('click', () => {
        warned.add(tech.soundDir);

      function start() {
        if (S.running) return;
        closeOverlay('#summary');
        sound.ensure(); // inside the tap: mobile browsers need the gesture
        S.running = true;
        S.cycles = 0;
        S.phase = -1;
        S.t0 = now() + COUNTDOWN;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.body.classList.add('in-session');
        orb.setAttribute('aria-label', T().stop);
        pulse();
        sound.startSession(S.t0);
        wakeLock.on();
      }
      function stop(fromLimit = false, silent = false) {
        if (!S.running) return;
        S.running = false;
        document.body.classList.remove('in-session');
        orb.setAttribute('aria-label', T().start);
        setCount(null);
        setPhase(T().tap, true);
        sound.stopSession();
        wakeLock.off();
        pulse();
        // recorded in the app's own history: same streak, same list
        const entry =
          S.elapsed >= MIN_RECORDED_SECS
            ? addSession({
                secs: Math.round(S.elapsed),
                cycles: S.cycles,
                technique: tech.soundDir,
              })
            : null;
        if (!silent && (fromLimit || S.elapsed >= 20))
          openSummary(S.elapsed, entry);
      }
      orb.addEventListener('click', () =>
        S.running ? stop() : requestStart(),
      );
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (panel.classList.contains('open')) return togglePanel(false);
          if (helpPanel.classList.contains('open')) return toggleHelp(false);
          if ($('#info-sheet').classList.contains('open'))
            return closeOverlay('#info-sheet');
          if ($('#notice').classList.contains('open'))
            return closeOverlay('#notice');
          if ($('#summary').classList.contains('open'))
            return closeOverlay('#summary');
          stop();
        }
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          S.running ? stop() : requestStart();
        }
      });

      function tick() {
        if (!S.running) {
          S.breath = 0;
          return;
        }
        const since = now() - S.t0;
        if (since < 0) {
          S.breath = 0;
          S.elapsed = 0;
          setPhase(T().getReady);
          setCount(Math.ceil(-since));
          setProgress(0);
          return;
        }
        S.elapsed = since;
        const total = tech.timing.reduce((s, v) => s + v, 0);
        const inCycle = since % total;
        S.cycles = Math.floor(since / total);
        let acc = 0;
        for (let i = 0; i < 4; i++) {
          const dur = tech.timing[i];
          if (!dur) continue;
          if (inCycle < acc + dur) {
            const ph = PHASE_SHAPE[i];
            S.breath =
              ph.from + (ph.to - ph.from) * ease((inCycle - acc) / dur);
            if (S.phase !== i) {
              S.phase = i;
              navigator.vibrate?.(30);
            }
            setPhase(T().phases[i]);
            setCount(dur >= 2 ? Math.ceil(dur - (inCycle - acc)) : null);
            break;
          }
          acc += dur;
        }
        setProgress(inCycle / total);
        $('#s-time').textContent = fmt(since);
        $('#s-cycle').textContent = S.cycles + 1;
        if (duration && since >= duration * 60) stop(true);
        if (tech.autoLimitCycles && S.cycles >= tech.autoLimitCycles)
          stop(true);
      }
      function setProgress(p) {
        trail.style.strokeDasharray = `${p} 1`;
        const a = p * Math.PI * 2 - Math.PI / 2;
        comet.setAttribute('cx', (100 + 99 * Math.cos(a)).toFixed(2));
        comet.setAttribute('cy', (100 + 99 * Math.sin(a)).toFixed(2));

      const fmt = (s) =>
        `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

        async on() {

      /* ── Sound ──────────────────────────────────────────────────────
         Four channels:
         - voice: the app's voice guide (<dir>-voice-<lang>.mp3), first
           helperCycles cycles; turned on later, it stays on
         - cues:  the app's phase cues (<dir>-breathing.mp3)
         - breath: generated air — filtered noise that follows the circle,
           brighter breathing in, darker breathing out
         - music: the app's ambient track, in the background
         The two tracks are exactly one cycle long and are scheduled on the
         AudioContext clock, cycle by cycle, a few seconds ahead. */
      const CH_DEFAULT = { voice: true, cues: true, breath: true, music: true };
      const CH_LEVEL = { voice: 0.55, cues: 0.5, breath: 1, music: 0.35 };
      const sound = {
        ctx: null,
        prefs: { ...CH_DEFAULT, ...store.get('concept.sound', {}) },
        vol: store.get('concept.volume', 0.8),
        buffers: new Map(),
        session: null,
        music: null,
        ensure() {
          if (this.ctx) return this.ctx.resume?.();
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          const ctx = (this.ctx = new AC());
          this.master = ctx.createGain();
          this.master.gain.value = this.vol;
          this.master.connect(ctx.destination);
          this.ch = {};
          for (const k of Object.keys(CH_DEFAULT)) {
            const g = ctx.createGain();
            g.gain.value = this.level(k);
            g.connect(this.master);
            this.ch[k] = g;
          }
          // generated breath: looped noise → band-pass → air gain
          const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          const n = ctx.createBufferSource();
          n.buffer = buf;
          n.loop = true;
          this.airFilter = ctx.createBiquadFilter();
          this.airFilter.type = 'bandpass';
          this.airFilter.frequency.value = 900;
          this.airFilter.Q.value = 0.7;
          this.air = ctx.createGain();
          this.air.gain.value = 0;
          n.connect(this.airFilter).connect(this.air).connect(this.ch.breath);
          n.start();
          // ambient music through the music channel
          this.music = new Audio('../assets/sounds/background-music.mp3');
          this.music.loop = true;
          ctx.createMediaElementSource(this.music).connect(this.ch.music);
          if (this.prefs.music) this.music.play().catch(() => {});
          this.preload();
        },
        level(k) {
          return this.prefs[k] ? CH_LEVEL[k] : 0;
        },
        set(k, on) {
          this.prefs[k] = on;
          store.set('concept.sound', this.prefs);
          this.ensure();
          if (!this.ctx) return;
          this.ch[k].gain.setTargetAtTime(
            this.level(k),
            this.ctx.currentTime,
            0.12,
          );
          if (k === 'music') on ? this.music.play().catch(() => {}) : null;
          if (k === 'voice' && on && this.session)
            this.session.voiceKeep = true;
          syncEq();
        },
        setVolume(v) {
          this.vol = v;
          store.set('concept.volume', v);
          if (this.ctx)
            this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
        },
        url(kind) {
          const d = tech.soundDir;
          return kind === 'voice'
            ? `../assets/sounds/${d}/${d}-voice-${lang}.mp3`
            : `../assets/sounds/${d}/${d}-breathing.mp3`;
        },
        async load(url) {
          if (!this.ctx) return null;
          if (!this.buffers.has(url))
            this.buffers.set(
              url,
              fetch(url)
                .then((r) => r.arrayBuffer())
                .then((b) => this.ctx.decodeAudioData(b))
                .catch(() => null),
            );
          return this.buffers.get(url);
        },
        preload() {
          this.load(this.url('voice'));
          this.load(this.url('cues'));
        },
        startSession(t0) {
          if (!this.ctx) return;
          const bus = this.ctx.createGain();
          bus.connect(this.master);
          const s = (this.session = {
            t0,
            bus,
            next: 0,
            voiceKeep: false,
            sources: [],
          });
          s.cycleDur = tech.timing.reduce((a, b) => a + b, 0);
          s.helper = tech.helperCycles ?? 3;
          const urls = { voice: this.url('voice'), cues: this.url('cues') };
          const run = async () => {
            if (this.session !== s) return;
            const [voice, cues] = await Promise.all([
              this.load(urls.voice),
              this.load(urls.cues),
            ]);
            const t = this.ctx.currentTime;
            while (s.t0 + s.next * s.cycleDur < t + 3) {
              const at = s.t0 + s.next * s.cycleDur;
              if (at + s.cycleDur > t) {
                const off = Math.max(0, t - at);
                if (cues) this.play(s, cues, 'cues', at, off);
                if (voice && (s.next < s.helper || s.voiceKeep))
                  this.play(s, voice, 'voice', at, off);
              }
              s.next++;
            }
          };
          run();
          s.timer = setInterval(run, 250);
        },
        play(s, buffer, chan, at, offset) {
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          const g = this.ctx.createGain();
          src.connect(g).connect(this.ch[chan]);
          src.start(
            Math.max(at, this.ctx.currentTime),
            offset,
            Math.max(0.01, s.cycleDur - offset),
          );
          s.sources.push(src);
          src.onended = () => (s.sources = s.sources.filter((x) => x !== src));
        },
        stopSession() {
          const s = this.session;
          if (!s) return;
          this.session = null;
          clearInterval(s.timer);
          const t = this.ctx.currentTime;
          // fade everything scheduled, then let it go
          for (const src of s.sources) {
            try {
              src.stop(t + 0.5);
            } catch {}
          }
          for (const k of ['voice', 'cues']) {
            this.ch[k].gain.setTargetAtTime(0, t, 0.12);
            this.ch[k].gain.setTargetAtTime(this.level(k), t + 0.6, 0.05);
          }
        },
        frame(b, v) {
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          const moving = S.running ? Math.min(Math.abs(v) * 0.09, 0.09) : 0;
          this.air.gain.setTargetAtTime(moving, t, 0.12);
          this.airFilter.frequency.setTargetAtTime(
            v >= 0 ? 750 + 600 * b : 480 + 380 * b,
            t,
            0.15,
          );
        },
      };

      /* Sound panel */
      const panel = $('#sound-panel');
      const soundBtn = $('#sound');
      function renderChannels() {

        wrap.innerHTML = '';
        for (const k of Object.keys(CH_DEFAULT)) {

          b.addEventListener('click', () => {
            const on = b.getAttribute('aria-checked') !== 'true';
            b.setAttribute('aria-checked', String(on));
            sound.set(k, on);

      $('#volume').addEventListener('input', (e) => {

      function togglePanel(open = !panel.classList.contains('open')) {

      /* ── WebGL aurora + lens ───────────────────────────────────────── */
      const canvas = $('#aurora');
      const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
      let prog, U;
      const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
      const FRAG = `
        precision highp float;
        uniform vec2 uRes; uniform float uTime, uBreath, uIntro, uPulse;
        uniform vec3 uOrb; uniform vec2 uMouse;
        const vec3 CREAM = vec3(.980,.965,.941);
        const vec3 SKY = vec3(.663,.816,.886);
        const vec3 SKY_DEEP = vec3(.45,.69,.80);
        const vec3 PEACH = vec3(.945,.835,.745);
        const vec3 MINT = vec3(.79,.90,.86);
        float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
        float noise(vec2 p){
          vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y);
        }
        float fbm(vec2 p){
          float v = 0., a = .5; mat2 m = mat2(1.6,1.2,-1.2,1.6);
          for(int i=0;i<4;i++){ v += a*noise(p); p = m*p; a *= .5; }
          return v;
        }
        // The landing's aura, alive: domain-warped noise mapped onto
        // sky (top-left) → cream → peach (bottom-right), a breath of mint
        vec3 field(vec2 frag){
          vec2 uv = frag/uRes;
          vec2 p = (frag - .5*uRes)/uRes.y + uMouse*.035;
          float t = uTime;
          vec2 q = vec2(fbm(p*1.2 + vec2(0., t*.030)), fbm(p*1.2 + vec2(5.2,1.3) - t*.025));
          vec2 r = vec2(fbm(p*1.4 + 1.8*q + vec2(1.7,9.2) + t*.020), fbm(p*1.4 + 1.8*q + vec2(8.3,2.8) - t*.020));
          float f = fbm(p*.9 + 1.4*r);
          float tz = clamp(.56 + (uv.x - uv.y)*.62 + (f - .5)*1.0, 0., 1.);
          vec3 col = CREAM;
          col = mix(col, SKY, (1. - smoothstep(.06, .46, tz))*(.7 + .3*q.x));
          col = mix(col, PEACH, smoothstep(.62, 1., tz)*.85);
          col = mix(col, MINT, smoothstep(.55, .85, r.y)*.22*(1. - abs(tz - .5)*2.));
          col = mix(col, SKY_DEEP, smoothstep(.62, .9, f)*(1. - smoothstep(0., .5, tz))*.45);
          return col;
        }
        vec3 sat(vec3 c, float s){ return mix(vec3(dot(c, vec3(.299,.587,.114))), c, s); }
        void main(){
          vec2 frag = gl_FragCoord.xy;
          vec2 c = uOrb.xy; float R = uOrb.z;
          vec2 dv = frag - c; float d = length(dv)/R;
          float inside = 1. - smoothstep(.985, 1., d);
          vec3 col;
          if (d < 1.02 && uBreath > .002) {
            // the lens: magnify the light inside, split it at the rim
            float k = mix(1., .78 + .2*d*d, uBreath);
            float ca = .03*uBreath*d*d*d;
            vec3 a = field(c + dv*(k + ca));
            vec3 b = field(c + dv*k);
            vec3 e = field(c + dv*(k - ca));
            vec3 lens = sat(vec3(a.r, b.g, e.b), 1. + .45*uBreath);
            lens = mix(lens, lens*vec3(.96,1.,1.03), .5*uBreath);
            vec3 bg = d > .97 ? field(frag) : lens;
            col = mix(bg, lens, inside);
          } else {
            col = field(frag);
          }
          col += vec3(1.)*.09*uBreath*smoothstep(.86, 1., d)*inside;
          float halo = exp(-max(d - 1., 0.)*5.)*(1. - inside);
          col = mix(col, vec3(1., .985, .96), .18*uBreath*halo);
          if (uPulse >= 0.) {
            float w = exp(-pow((d - (1. + uPulse*2.4))*2.2, 2.))*(1. - clamp(uPulse/1.8, 0., 1.));
            col = mix(col, vec3(1.), w*.32);
          }
          col = mix(CREAM, col, uIntro);
          col += (hash(frag + fract(uTime)*100.) - .5)*.014;
          gl_FragColor = vec4(col, 1.);
        }`;
      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          throw new Error(gl.getShaderInfoLog(s));
        return s;
      }
      try {
        if (!gl) throw new Error('no webgl');
        prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
          throw new Error(gl.getProgramInfoLog(prog));
        gl.useProgram(prog);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );
        const loc = gl.getAttribLocation(prog, 'p');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        U = {};
        [
          'uRes',
          'uTime',
          'uBreath',
          'uIntro',
          'uPulse',
          'uOrb',
          'uMouse',
        ].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
      } catch (err) {
        console.warn('Aurora fallback:', err.message);
        document.documentElement.classList.add('no-gl');
        prog = null;
      }

      /* ── Motes: dust in the light ──────────────────────────────────── */
      const mc = $('#motes');
      const mx = mc.getContext('2d');
      const MOTES = Array.from({ length: 90 }, () => ({
        a: Math.random() * Math.PI * 2,
        w: (Math.random() * 0.06 + 0.015) * (Math.random() < 0.5 ? -1 : 1),
        s: Math.random(),
        z: Math.random() * 1.6 + 0.6,
        ph: Math.random() * Math.PI * 2,
        tint: Math.random(),
      }));

      /* ── Sizing ────────────────────────────────────────────────────── */
      let W = 0,
        H = 0,
        renderScale = 1,
        dpr = 1;
      function resize() {
        W = innerWidth;
        H = innerHeight;
        dpr = Math.min(devicePixelRatio || 1, 2);
        renderScale = Math.min(dpr, 1.5) * 0.7; // the aura is soft: render it below full res
        canvas.width = Math.round(W * renderScale);
        canvas.height = Math.round(H * renderScale);
        mc.width = Math.round(W * dpr);
        mc.height = Math.round(H * dpr);
        if (prog) gl.viewport(0, 0, canvas.width, canvas.height);
        moveThumb();
      }
      addEventListener('resize', resize);

      const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
      addEventListener('pointermove', (e) => {
        mouse.tx = (e.clientX / W - 0.5) * 2;
        mouse.ty = (0.5 - e.clientY / H) * 2;
      });

      let pulseAt = -1;
      function pulse() {
        pulseAt = performance.now();
      }

      /* ── Frame ─────────────────────────────────────────────────────── */
      const tStart = performance.now();
      let last = tStart,
        time = 0;
      function frame(t) {
        const dt = Math.min((t - last) / 1000, 0.05);
        last = t;
        time += dt * (reduced ? 0.15 : 1);
        tick();

        const prev = S.shown;
        S.shown +=
          (S.breath - S.shown) * (1 - Math.exp(-dt * (S.running ? 14 : 3)));
        S.velocity = (S.shown - prev) / Math.max(dt, 1e-3);
        const idle = S.running ? 0 : Math.sin(t / 1600) * 0.012;
        const target = S.running ? 0.72 + 0.4 * S.shown : 0.86 + idle;
        S.scale +=
          (target - S.scale) * (1 - Math.exp(-dt * (S.running ? 14 : 4)));
        ring.style.setProperty('--s', S.scale.toFixed(4));
        const b = S.shown;
        const lerp = (x, y) => Math.round(x + (y - x) * b);
        ringBase.style.stroke = `rgba(${lerp(62, 255)},${lerp(113, 255)},${lerp(137, 255)},${(0.42 + 0.45 * b).toFixed(3)})`;

        mouse.x += (mouse.tx - mouse.x) * 0.04;
        mouse.y += (mouse.ty - mouse.y) * 0.04;

        const r = orb.getBoundingClientRect();
        const cx = r.left + r.width / 2,
          cy = r.top + r.height / 2;
        const R = (r.width / 2) * S.scale;

        if (prog) {
          const intro = Math.min((t - tStart) / 1800, 1);
          gl.uniform2f(U.uRes, canvas.width, canvas.height);
          gl.uniform1f(U.uTime, time);
          gl.uniform1f(U.uBreath, b);
          gl.uniform1f(U.uIntro, 1 - Math.pow(1 - intro, 3));
          gl.uniform1f(U.uPulse, pulseAt < 0 ? -1 : (t - pulseAt) / 1000);
          gl.uniform3f(
            U.uOrb,
            cx * renderScale,
            (H - cy) * renderScale,
            R * renderScale,
          );
          gl.uniform2f(U.uMouse, mouse.x, mouse.y);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        if (!reduced) {
          mx.setTransform(dpr, 0, 0, dpr, 0, 0);
          mx.clearRect(0, 0, W, H);
          const vis = S.running ? 1 : 0.35;
          for (const m of MOTES) {
            m.a += m.w * dt * (1 + b * 0.8);
            const spread = 1.12 + m.s * 1.6 * (1 - 0.72 * b);
            const wob = Math.sin(t / 1000 + m.ph) * 6;
            const d = R * spread + wob;
            const x = cx + Math.cos(m.a) * d,
              y = cy + Math.sin(m.a) * d;
            const al =
              (0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t / 900 + m.ph))) *
              vis *
              (1 - m.s * 0.5);
            const tint =
              m.tint < 0.5
                ? '255,255,255'
                : m.tint < 0.8
                  ? '200,228,240'
                  : '250,222,200';
            mx.beginPath();
            mx.fillStyle = `rgba(${tint},${al.toFixed(3)})`;
            mx.arc(x, y, m.z, 0, Math.PI * 2);
            mx.fill();
          }
        }

        sound.frame(b, S.velocity);
        requestAnimationFrame(frame);
      }

      /* ── Boot ──────────────────────────────────────────────────────── */
      splitInto($('#wordmark'), 'Neyen', 90, 300);
      applyLang();
      drawTicks();
      syncEq();
      resize();
      requestAnimationFrame(moveThumb);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
